<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CART3R AI Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #10121a;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    padding: 25px;
    background: #1b1f2b;
    border: 1px solid #00e5ff;
    border-radius: 18px;
    box-shadow: 0 0 20px #00e5ff33;
}

h1 {
    text-align: center;
    color: #00e5ff;
    font-size: 35px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

h2 {
    color: #00e5ff;
    font-size: 19px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: bold;
}

select, input {
    width: 100%;
    padding: 13px;
    border: 1px solid #343b4d;
    border-radius: 8px;
    background: #10121a;
    color: white;
    font-size: 15px;
}

input:focus, select:focus {
    outline: none;
    border-color: #00e5ff;
}

.password-box {
    display: flex;
    gap: 8px;
}

.password-box input {
    flex: 1;
    min-width: 0;
}

.password-box button {
    padding: 10px;
    background: #343b4d;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.start-button {
    width: 100%;
    margin-top: 28px;
    padding: 16px;
    background: #00e5ff;
    color: #10121a;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.start-button:disabled {
    background: #555;
    color: #aaa;
    cursor: not-allowed;
}

.status {
    margin-top: 22px;
    padding: 15px;
    background: #10121a;
    border-radius: 8px;
    text-align: center;
    color: #00e5ff;
}

.footer {
    text-align: center;
    color: #777;
    margin-top: 25px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>CART3R AI</h1>
    <p class="subtitle">HomeworkHelper Dashboard</p>

    <h2>1. Select compulsory homework</h2>

    <label for="subject">Homework subject *</label>
    <select id="subject" required>
        <option value="">Choose a subject</option>
        <option value="Maths">Sparx Maths</option>
        <option value="Science">Sparx Science</option>
        <option value="Reader">Sparx Reader</option>
    </select>

    <label for="platform">Select platform *</label>
    <select id="platform" required>
        <option value="">Choose a platform</option>
        <option value="Sparx Maths">Sparx Maths</option>
        <option value="Sparx Science">Sparx Science</option>
        <option value="Sparx Reader">Sparx Reader</option>
    </select>

    <h2 style="margin-top:30px;">2. Test account login</h2>

    <label for="username">Email / Username *</label>
    <input
        type="text"
        id="username"
        placeholder="Enter test account email or username"
        autocomplete="username"
        required
    >

    <label for="password">Password *</label>

    <div class="password-box">
        <input
            type="password"
            id="password"
            placeholder="Enter test account password"
            autocomplete="current-password"
            required
        >

        <button type="button" onclick="togglePassword()">
            Show
        </button>
    </div>

    <button
        class="start-button"
        id="startButton"
        disabled
        onclick="startCART3R()"
    >
        START CART3R
    </button>

    <div class="status" id="status">
        CART3R is waiting for the required information.
    </div>

    <div class="footer">
        CART3R AI HomeworkHelper | Test Dashboard
    </div>

</div>

<script>

const subject = document.getElementById("subject");
const platform = document.getElementById("platform");
const username = document.getElementById("username");
const password = document.getElementById("password");
const startButton = document.getElementById("startButton");
const statusBox = document.getElementById("status");

function checkForm() {
    const complete =
        subject.value !== "" &&
        platform.value !== "" &&
        username.value.trim() !== "" &&
        password.value.trim() !== "";

    startButton.disabled = !complete;
}

subject.addEventListener("change", checkForm);
platform.addEventListener("change", checkForm);
username.addEventListener("input", checkForm);
password.addEventListener("input", checkForm);

function togglePassword() {
    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}

function startCART3R() {
    checkForm();

    if (startButton.disabled) {
        return;
    }

    statusBox.textContent =
        "Dashboard ready. Secure backend connection still needs configuring.";

    // Credentials are deliberately NOT sent or saved here.
}

</script>

</body>
</html>
